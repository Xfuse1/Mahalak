<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>محلك — غير متصل</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: #FBF8F1; color: #1f2937;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; text-align: center;
    }
    .card { max-width: 380px; width: 100%; }
    .logo {
      width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 22px;
      background: #1B7A4B; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(27,122,75,.25);
    }
    .logo svg { width: 46px; height: 46px; }
    h1 { font-size: 22px; font-weight: 800; color: #14532d; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.7; color: #4b5563; margin-bottom: 24px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #1B7A4B; color: #fff; font-size: 16px; font-weight: 700;
      padding: 13px 30px; border-radius: 14px; font-family: inherit;
      transition: transform .12s ease, background .12s ease;
    }
    button:hover { background: #166534; transform: translateY(-1px); }
    .hint { margin-top: 18px; font-size: 13px; color: #9ca3af; }
    @media (prefers-color-scheme: dark) {
      body { background: #0b1220; color: #e5e7eb; }
      h1 { color: #86efac; }
      p { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l1-5h16l1 5" /><path d="M4 9v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9" />
        <path d="M9 22V12h6v10" />
      </svg>
    </div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>محتاجين اتصال بالإنترنت عشان نعرضلك محلك. اتأكد من الشبكة وحاول تاني.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <div class="hint">محلك — سوق الحي المصري</div>
  </div>
</body>
</html>
