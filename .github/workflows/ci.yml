name: CI

# بوابة تمنع دمج/دفع بناء مكسور إلى main. البوابة الصلبة = فحص الأنواع (tsc)،
# وهو لا يحتاج أي أسرار/متغيّرات بيئة. (كان بناء main مكسورًا يختبئ 4 كوميتات سابقًا.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck (hard gate — fails the build on any type error)
        run: npx tsc --noEmit
      - name: Unit tests (hard gate — money/discount logic)
        run: npm test
      - name: Lint (informational — does not block)
        run: npm run lint
        continue-on-error: true
