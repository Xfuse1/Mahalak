version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 (App Router, React Server Components + Server Actions)
  - React 19
  - Tailwind CSS v4
  - Radix UI
  - lucide-react
  - Zustand (client state: cart)
  - Firebase (Auth Phone OTP, Firestore) + firebase-admin
  - i18next / react-i18next (Arabic, RTL)
  - three.js (3D supermarket)
routes:
