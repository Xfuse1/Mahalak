features:
  - name: Customer Registration
    description: Register a new customer with name, unique email, strong password and Egyptian phone number
    files:
      - app/auth/register/page.tsx
      - lib/auth-context.tsx
      - lib/actions/profile.ts
      - lib/utils/phone.ts
      - lib/utils/password.ts
    entry_route: /auth/register
    user_interactions:
      - Fill full name input
      - Fill unique email input
      - Fill password input (>=6 chars, must include a letter and a number)
      - Fill phone input with 01000000000
      - Submit the registration form
      - Get redirected to phone OTP verification
    api_calls:
      - method: POST
        endpoint: server-action:createUserProfile (Firebase Auth + Firestore)
    auth_required: false
  - name: Phone OTP Verification
    description: Verify the phone number via Firebase Phone Auth using the fixed test OTP
    files:
      - app/auth/verify-phone/page.tsx
      - lib/auth-context.tsx
    entry_route: /auth/verify-phone
    user_interactions:
      - Enter the 6-digit OTP 123456
      - Submit to confirm verification
      - See success and become authenticated
    api_calls:
      - method: POST
        endpoint: firebase:signInWithPhoneNumber/confirm
    auth_required: false
  - name: Browse Stores and Products
    description: Browse the home, stores, categories, and open a product detail page
    files:
      - app/page.tsx
      - app/store/[id]/page.tsx
      - app/product/[id]/page.tsx
      - components/product-card.tsx
    entry_route: /
    user_interactions:
      - Click into a store or category
      - Open a product detail page
    api_calls:
      - method: GET
        endpoint: firestore:products/stores
    auth_required: false
  - name: Add to Cart
    description: Add a product to the cart from the product page
    files:
      - app/product/[id]/page.tsx
      - lib/stores/cart-store.ts
    entry_route: /product/[id]
    user_interactions:
      - Click "أضف للسلة" (Add to cart)
      - Open the cart (/cart) and see the item
    api_calls: []
    auth_required: false
  - name: Checkout with Cash on Delivery
    description: Enter delivery address, choose a driver, and confirm a COD order
    files:
      - app/checkout/page.tsx
      - app/checkout/delivery/page.tsx
      - lib/actions/orders.ts
      - lib/actions/delivery.ts
    entry_route: /checkout
    user_interactions:
      - Enter the delivery address
      - Proceed to delivery and choose a driver
      - Confirm the order (Cash on Delivery)
      - See an order-success message
    api_calls:
      - method: POST
        endpoint: server-action:createOrder (Firestore, atomic)
    auth_required: true
  - name: View My Orders
    description: See the placed order in the customer account order history
    files:
      - app/account/page.tsx
      - lib/actions/orders.ts
    entry_route: /account
    user_interactions:
      - Open /account
      - Confirm the new order appears in the list
    api_calls:
      - method: GET
        endpoint: server-action:getUserOrders
    auth_required: true
  - name: Seller Registration
    description: Register a new seller/merchant with store name, description, type/category and phone, then OTP
    files:
      - app/auth/seller/register/page.tsx
      - lib/actions/stores.ts
      - lib/auth-context.tsx
    entry_route: /auth/seller/register
    user_interactions:
      - Fill store name, description, type/category
      - Fill phone 01000000001
      - Submit and complete OTP 123456
    api_calls:
      - method: POST
        endpoint: server-action:createStore (Firebase Auth + Firestore)
    auth_required: false
  - name: Seller Dashboard
    description: Seller logs in and opens the dashboard
    files:
      - app/seller/dashboard/page.tsx
      - app/auth/seller/login/page.tsx
    entry_route: /seller/dashboard
    user_interactions:
      - Log in as seller
      - Open the seller dashboard
    api_calls:
      - method: GET
        endpoint: firestore:store/user doc
    auth_required: true
  - name: Add Product
    description: Seller creates a new product with name, selling price, cost price (< selling), quantity, category, optional image
    files:
      - app/seller/products/new/page.tsx
      - lib/actions/product-form-actions.ts
      - lib/actions/products.ts
    entry_route: /seller/products/new
    user_interactions:
      - Fill product name
      - Fill selling price
      - Fill cost/purchase price lower than selling price
      - Fill quantity
      - Select category
      - Optionally upload an image
      - Save the product
    api_calls:
      - method: POST
        endpoint: server-action:createProduct (Firestore)
    auth_required: true
  - name: Seller Product List
    description: Confirm the newly created product appears in the seller's product list
    files:
      - app/seller/products/page.tsx
      - lib/actions/products.ts
    entry_route: /seller/products
    user_interactions:
      - Open /seller/products
      - Confirm the new product is listed
    api_calls:
      - method: GET
        endpoint: server-action:getSellerProducts
    auth_required: true
known_limitations:
  - issue: Authentication uses Firebase Phone OTP; email/password test-account fields do not drive login
    location: lib/auth-context.tsx
    impact: Automated login must use phone 01000000000 / seller 01000000001 with fixed OTP 123456 (Firebase test numbers, reCAPTCHA and SMS bypassed)
  - issue: Backend is implemented via Next.js Server Actions and Firebase SDK, not REST endpoints
    location: lib/actions/*
    impact: There is no /api/* surface; api_calls above reference server actions / Firebase SDK calls
  - issue: Store approval gate (is_approved) is not enforced in public getStores
    location: lib/actions/stores.ts
    impact: New seller stores/products may be publicly visible without an approval step
