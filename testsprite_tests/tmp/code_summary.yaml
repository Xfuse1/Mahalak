version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16
  - React 19
  - Tailwind CSS
  - shadcn/ui
  - Firebase Auth
  - Firestore
  - Lucide React Icons
routes:
  - path: /
    file: app/page.tsx
    auth_required: false
    description: Homepage with store listings and categories
  - path: /auth
    file: app/auth/page.tsx
    auth_required: false
    description: Login and registration page
  - path: /auth/forgot-password
    file: app/auth/forgot-password/page.tsx
    auth_required: false
    description: Forgot password page
  - path: /auth/reset-password
    file: app/auth/reset-password/page.tsx
    auth_required: false
    description: Reset password page
  - path: /auth/verify-phone
    file: app/auth/verify-phone/page.tsx
    auth_required: true
    description: Phone verification page
  - path: /store
    file: app/store/page.tsx
    auth_required: false
    description: Store listing page
  - path: /store/[id]
    file: app/store/[id]/page.tsx
    auth_required: false
    description: Individual store page with products
  - path: /product/[id]
    file: app/product/[id]/page.tsx
    auth_required: false
    description: Product detail page
  - path: /category/[name]
    file: app/category/[name]/page.tsx
    auth_required: false
    description: Category products page
  - path: /search
    file: app/search/page.tsx
    auth_required: false
    description: Search results page
  - path: /cart
    file: app/cart/page.tsx
    auth_required: false
    description: Shopping cart page
  - path: /checkout
    file: app/checkout/page.tsx
    auth_required: true
    description: Checkout page
  - path: /checkout/delivery
    file: app/checkout/delivery/page.tsx
    auth_required: true
    description: Delivery options page
  - path: /account
    file: app/account/page.tsx
    auth_required: true
    description: User account page
  - path: /account/edit-order/[id]
    file: app/account/edit-order/[id]/page.tsx
    auth_required: true
    description: Edit order page
  - path: /account/change-driver
    file: app/account/change-driver/page.tsx
    auth_required: true
    description: Change driver page
  - path: /review/[orderId]
    file: app/review/[orderId]/page.tsx
    auth_required: true
    description: Order review page
  - path: /pos/qpos
    file: app/pos/qpos/page.tsx
    auth_required: true
    description: Point of Sale cashier interface
  - path: /pos/receipt
    file: app/pos/receipt/page.tsx
    auth_required: false
    description: Receipt display page
  - path: /seller/dashboard
    file: app/seller/dashboard/page.tsx
    auth_required: true
    description: Seller dashboard with analytics
  - path: /seller/products
    file: app/seller/products/page.tsx
    auth_required: true
    description: Seller product management
  - path: /seller/products/new
    file: app/seller/products/new/page.tsx
    auth_required: true
    description: Add new product page
  - path: /seller/products/edit/[id]
    file: app/seller/products/edit/[id]/page.tsx
    auth_required: true
    description: Edit product page
  - path: /seller/orders
    file: app/seller/orders/page.tsx
    auth_required: true
    description: Seller orders management
  - path: /seller/my-orders
    file: app/seller/my-orders/page.tsx
    auth_required: true
    description: Seller personal orders
  - path: /seller/offers
    file: app/seller/offers/page.tsx
    auth_required: true
    description: Seller offers management
  - path: /seller/settings
    file: app/seller/settings/page.tsx
    auth_required: true
    description: Seller store settings
  - path: /seller/supermarket-3d
    file: app/seller/supermarket-3d/page.tsx
    auth_required: true
    description: 3D supermarket layout editor
  - path: /driver/orders
    file: app/driver/orders/page.tsx
    auth_required: true
    description: Driver orders page
  - path: /about
    file: app/about/page.tsx
    auth_required: false
    description: About page
  - path: /faq
    file: app/faq/page.tsx
    auth_required: false
    description: FAQ page
  - path: /terms
    file: app/terms/page.tsx
    auth_required: false
    description: Terms and conditions
  - path: /privacy
    file: app/privacy/page.tsx
    auth_required: false
    description: Privacy policy
  - path: /supermarket
    file: app/supermarket/page.tsx
    auth_required: false
    description: Supermarket browsing page
features:
  - name: User Authentication
    description: Login and registration with email/password via Firebase Auth
    files:
      - app/auth/page.tsx
      - components/auth/login-form.tsx
      - lib/auth-context.tsx
      - lib/firebase/auth.ts
    entry_route: /auth
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click login button to submit
      - Toggle between login and register tabs
      - See error message on invalid credentials
      - Redirect to home page on successful login
    api_calls:
      - method: POST
        endpoint: Firebase Auth signInWithEmailAndPassword
      - method: POST
        endpoint: Firebase Auth createUserWithEmailAndPassword
    auth_required: false
  - name: POS Product Grid and Cart
    description: Browse products in grid view and add them to the POS cart for checkout
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos.ts
    entry_route: /pos/qpos
    user_interactions:
      - View product grid with images, names, and prices
      - Click a product card to add it to the cart
      - Click same product again to increment quantity
      - Use search bar to filter products by name
      - Filter products by category tabs
      - Use voice search button for Arabic speech recognition
      - View cart items in right panel with quantities and totals
      - Click plus/minus buttons to adjust quantity in cart
      - Click trash icon to remove item from cart
      - Click clear cart button to empty all items
    api_calls:
      - method: GET
        endpoint: Firestore stores/{storeId}/products
    auth_required: true
  - name: POS Barcode Scanner
    description: Scan product barcodes using device camera to add products to cart
    files:
      - app/pos/qpos/page.tsx
      - components/barcode-scanner.tsx
    entry_route: /pos/qpos
    user_interactions:
      - Click barcode scanner button in header
      - Allow camera access when prompted
      - Point camera at product barcode
      - Product auto-added to cart on successful scan
      - Enter barcode manually in text input as fallback
    api_calls: []
    auth_required: true
  - name: POS Payment and Checkout
    description: Complete sale with cash or card payment, generate receipt
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos.ts
    entry_route: /pos/qpos
    user_interactions:
      - Click payment button to open payment modal
      - Select payment method - cash or card
      - For cash - enter amount received and see change calculated
      - For split payment - enter cash amount and card amount
      - Click confirm sale button to process payment
      - See success confirmation with sale details
      - Click print receipt button
      - Click send receipt via WhatsApp button
    api_calls:
      - method: POST
        endpoint: Firestore stores/{storeId}/sales (create sale document)
      - method: PUT
        endpoint: Firestore stores/{storeId}/products (update stock quantities)
    auth_required: true
  - name: POS Hold Cart
    description: Hold current cart for later and resume held carts
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos-features.ts
    entry_route: /pos/qpos
    user_interactions:
      - Click hold cart button (تعليق) in header
      - Enter optional note for the held cart
      - Confirm hold action
      - Click held carts list button to view all held carts
      - See list of held carts with timestamps and notes
      - Click resume button on a held cart to restore it
      - Click delete button to remove a held cart
    api_calls:
      - method: POST
        endpoint: Firestore stores/{storeId}/held_carts (create held cart)
      - method: GET
        endpoint: Firestore stores/{storeId}/held_carts (list held carts)
      - method: DELETE
        endpoint: Firestore stores/{storeId}/held_carts/{id} (delete held cart)
    auth_required: true
  - name: POS Customer Management
    description: Create and manage POS customers, link to sales
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos-features.ts
    entry_route: /pos/qpos
    user_interactions:
      - Click customers button (العملاء) in header
      - Search customers by phone number
      - Click add new customer button
      - Fill customer name, phone, email, notes
      - Save new customer
      - Select existing customer to link to current sale
      - View customer purchase history
    api_calls:
      - method: POST
        endpoint: Firestore stores/{storeId}/pos_customers (create customer)
      - method: GET
        endpoint: Firestore stores/{storeId}/pos_customers (search customers)
      - method: PUT
        endpoint: Firestore stores/{storeId}/pos_customers/{id} (update after sale)
    auth_required: true
  - name: POS Returns and Refunds
    description: Process returns and refunds for previous sales
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos-features.ts
    entry_route: /pos/qpos
    user_interactions:
      - Click returns button (المرتجعات) in header
      - Enter sale ID to search for original sale
      - View sale items and select items to return
      - Set return quantity for each item
      - Select return type - refund or exchange
      - Select refund method - cash or card
      - Enter return reason
      - Confirm return and see success message
    api_calls:
      - method: GET
        endpoint: Firestore stores/{storeId}/sales/{saleId} (get sale for return)
      - method: POST
        endpoint: Firestore stores/{storeId}/pos_returns (create return record)
      - method: PUT
        endpoint: Firestore stores/{storeId}/products (restock returned items)
    auth_required: true
  - name: POS Shift Management
    description: Open and close cashier shifts with cash tracking
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos-features.ts
    entry_route: /pos/qpos
    user_interactions:
      - Click shift button (الوردية) in header
      - Enter starting cash amount to open shift
      - Click open shift button
      - See active shift info in header (sales count, total)
      - Click close shift button
      - Enter ending cash amount
      - See cash difference calculation
      - Enter close notes for discrepancies
      - Confirm shift close
    api_calls:
      - method: POST
        endpoint: Firestore stores/{storeId}/pos_shifts (open shift)
      - method: PUT
        endpoint: Firestore stores/{storeId}/pos_shifts/{id} (close shift)
      - method: GET
        endpoint: Firestore stores/{storeId}/pos_shifts (get current shift)
    auth_required: true
  - name: POS Coupons
    description: Create and apply discount coupons at checkout
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos-features.ts
    entry_route: /pos/qpos
    user_interactions:
      - Click coupons button (الكوبونات) in header
      - View list of existing coupons
      - Click create new coupon
      - Enter coupon code, type (percentage/fixed), value, expiry, usage limit
      - Save new coupon
      - Toggle coupon active/inactive
      - In payment modal enter coupon code to apply discount
      - See discount reflected in total
    api_calls:
      - method: POST
        endpoint: Firestore stores/{storeId}/pos_coupons (create coupon)
      - method: GET
        endpoint: Firestore stores/{storeId}/pos_coupons (list coupons)
      - method: PUT
        endpoint: Firestore stores/{storeId}/pos_coupons/{id} (toggle/use coupon)
    auth_required: true
  - name: Pharmacy Expiry Tracking
    description: Track product expiry dates, block expired products from sale
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos-pharmacy.ts
    entry_route: /pos/qpos
    user_interactions:
      - See expiry badges on product cards (days until expiry)
      - Click expiry alerts button (الصلاحية) in header
      - View list of critical (red) and warning (orange) expiry alerts
      - Expired products are blocked during checkout with error message
      - Near-expiry products show warning confirmation before sale
    api_calls:
      - method: GET
        endpoint: Firestore stores/{storeId}/products (filter by expiry fields)
    auth_required: true
  - name: Pharmacy Prescription Management
    description: Record and search prescriptions linked to pharmacy sales
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos-pharmacy.ts
    entry_route: /pos/qpos
    user_interactions:
      - See Rx badge on prescription-required products
      - Prescription modal auto-opens when Rx product is in cart at checkout
      - Enter doctor name, patient name, patient phone, diagnosis
      - Save prescription record linked to sale
      - Click prescriptions button (روشتات) to view history
      - Search prescriptions by patient name or phone
      - View prescription details
    api_calls:
      - method: POST
        endpoint: Firestore stores/{storeId}/prescriptions (create prescription)
      - method: GET
        endpoint: Firestore stores/{storeId}/prescriptions (search prescriptions)
    auth_required: true
  - name: Pharmacy Insurance Claims
    description: Manage insurance companies and create claims during pharmacy sales
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos-pharmacy.ts
    entry_route: /pos/qpos
    user_interactions:
      - Click insurance button (تأمين) in header
      - View insurance companies list
      - Add new insurance company with name and coverage percentage
      - Toggle insurance company active/inactive
      - In payment modal select insurance company
      - Enter policy number
      - See copay amount auto-calculated
      - Insurance claim auto-created after successful sale
      - View insurance claims with status
    api_calls:
      - method: POST
        endpoint: Firestore stores/{storeId}/insurance_companies (add company)
      - method: GET
        endpoint: Firestore stores/{storeId}/insurance_companies (list companies)
      - method: POST
        endpoint: Firestore stores/{storeId}/insurance_claims (create claim)
      - method: GET
        endpoint: Firestore stores/{storeId}/insurance_claims (list claims)
    auth_required: true
  - name: Pharmacy Drug Alternatives
    description: Find alternative drugs by active ingredient
    files:
      - app/pos/qpos/page.tsx
      - lib/actions/pos-pharmacy.ts
    entry_route: /pos/qpos
    user_interactions:
      - Click alternatives button (بدائل) on a pharmacy product card
      - See list of alternative drugs with same active ingredient
      - View alternative name, manufacturer, price, availability
      - Click add button to add alternative to cart
    api_calls:
      - method: GET
        endpoint: Firestore stores/{storeId}/products (search by active_ingredient)
    auth_required: true
known_limitations:
  - issue: POS page requires store owner login - test account must be a seller with products
    location: app/pos/qpos/page.tsx
    impact: POS features only accessible to authenticated store owners
  - issue: Pharmacy features only visible for stores with health/pharmacy category
    location: app/pos/qpos/page.tsx
    impact: Pharmacy buttons and modals hidden for non-pharmacy stores
  - issue: Barcode scanner requires camera access in browser
    location: components/barcode-scanner.tsx
    impact: Barcode scanning will not work in headless browser testing
  - issue: Voice search requires microphone and Web Speech API
    location: app/pos/qpos/page.tsx
    impact: Voice search will not work in headless browser testing
