    file: app/page.tsx
    auth_required: false
    description: Home page — stores, products, categories, nearby-neighborhood discovery
  - path: /auth
    file: app/auth/page.tsx
    auth_required: false
    description: Auth landing (login) for customers via phone OTP
  - path: /auth/register
    file: app/auth/register/page.tsx
    auth_required: false
    description: Customer registration (name, email, password, phone)
  - path: /auth/verify-phone
    file: app/auth/verify-phone/page.tsx
    auth_required: false
    description: Phone OTP verification screen
  - path: /auth/forgot-password
    file: app/auth/forgot-password/page.tsx
    auth_required: false
    description: Forgot password
  - path: /auth/reset-password
    file: app/auth/reset-password/page.tsx
    auth_required: false
    description: Reset password
  - path: /auth/seller
    file: app/auth/seller/page.tsx
    auth_required: false
    description: Seller auth landing
  - path: /auth/seller/register
    file: app/auth/seller/register/page.tsx
    auth_required: false
    description: Seller registration with store details + phone OTP
  - path: /auth/seller/login
    file: app/auth/seller/login/page.tsx
    auth_required: false
    description: Seller login
  - path: /store
    file: app/store/page.tsx
    auth_required: false
    description: Stores listing
  - path: /store/[id]
    file: app/store/[id]/page.tsx
    auth_required: false
    description: Single store page with its products
  - path: /category/[name]
    file: app/category/[name]/page.tsx
    auth_required: false
    description: Products by category
  - path: /product/[id]
    file: app/product/[id]/page.tsx
    auth_required: false
    description: Product detail page with Add to cart
  - path: /search
    file: app/search/page.tsx
    auth_required: false
    description: Product/store search
  - path: /supermarket
    file: app/supermarket/page.tsx
    auth_required: false
    description: 2D/3D supermarket simulator
  - path: /cart
    file: app/cart/page.tsx
    auth_required: false
    description: Shopping cart
  - path: /checkout
    file: app/checkout/page.tsx
    auth_required: true
    description: Checkout — address entry, order review
  - path: /checkout/delivery
    file: app/checkout/delivery/page.tsx
    auth_required: true
    description: Delivery — choose driver, confirm COD order
  - path: /account
    file: app/account/page.tsx
    auth_required: true
    description: Customer account and order history
  - path: /account/change-driver
    file: app/account/change-driver/page.tsx
    auth_required: true
    description: Change assigned driver for an order
  - path: /account/edit-order/[id]
    file: app/account/edit-order/[id]/page.tsx
    auth_required: true
    description: Edit an existing order
  - path: /review/[orderId]
    file: app/review/[orderId]/page.tsx
    auth_required: true
    description: Leave a review for a delivered order
  - path: /seller/dashboard
    file: app/seller/dashboard/page.tsx
    auth_required: true
    description: Seller dashboard
  - path: /seller/products
    file: app/seller/products/page.tsx
    auth_required: true
    description: Seller product list
  - path: /seller/products/new
    file: app/seller/products/new/page.tsx
    auth_required: true
    description: Create a new product
  - path: /seller/products/edit/[id]
    file: app/seller/products/edit/[id]/page.tsx
    auth_required: true
